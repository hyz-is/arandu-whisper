# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls.

name = "hyz-is/whisper"
framework = ">= 0.50"
profiles = ["conventional", "performance"]

[permissions]
# Transcription runs on the application's own server. Nothing leaves the process
# by the network: no audio, no text, no telemetry.
network = false
# Each call writes the audio and the converted WAV to a private temporary
# directory (Config.TempDir), reads whisper's output from it, and removes it
# before returning. It also reads the configured model file.
filesystem = true
# It starts ffprobe, ffmpeg and whisper-cli, by the paths in Config, without a
# shell and with fixed arguments.
exec = true
# It owns no table.
migrations = false
